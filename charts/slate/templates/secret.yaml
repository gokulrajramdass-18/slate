apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slate.fullname" . }}-secrets
  labels:
    {{- include "slate.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-key: {{ .Values.secrets.encryptionKey | required "secrets.encryptionKey is required" | quote }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
