apiVersion: apps/v1
kind: Deployment
metadata:
  name: slate-frontend
  labels:
    app: slate
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slate
      component: frontend
  template:
    metadata:
      labels:
        app: slate
        component: frontend
    spec:
      containers:
      - name: frontend
        image: <YOUR_DOCKER_REGISTRY>/slate-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://slate-backend:5055"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: slate-frontend
  labels:
    app: slate
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: slate
    component: frontend
