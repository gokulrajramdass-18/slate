version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: slate-backend-approuter
    ports:
      - "5055:5055"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5055
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/database.db
      - XSUAA_ENABLED=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-dev-secret-key-change-me}
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      # Public origin (AppRouter) — used to build OAuth redirect URIs so
      # the URL Outreach (or any other IdP) sees matches what the user's
      # browser actually loads. Leave unset for non-AppRouter dev.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5001}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder-not-used}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-placeholder-not-used}
      - LOG_LEVEL=INFO
      # SAP AI Core credentials for auto-import
      - AICORE_AUTH_URL=${AICORE_AUTH_URL:-}
      - AICORE_BASE_URL=${AICORE_BASE_URL:-}
      - AICORE_CLIENT_ID=${AICORE_CLIENT_ID:-}
      - AICORE_CLIENT_SECRET=${AICORE_CLIENT_SECRET:-}
      - AICORE_RESOURCE_GROUP=${AICORE_RESOURCE_GROUP:-default}
      # Use local SAP AI Core proxy instead of external API
      - SAP_AI_CORE_PROXY_URL=http://host.docker.internal:5056
      # Local S3 (MinIO) for file uploads
      - S3_ENABLED=true
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=open-notebook-files
      - S3_REGION=us-east-1
      - S3_USE_SSL=false
    volumes:
      - ../../backend/data:/app/data
    networks:
      - slate-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_XSUAA_ENABLED=true
    container_name: slate-frontend-approuter
    ports:
      - "3000:3000"
    environment:
      # Frontend should NOT use API URL when behind AppRouter
      # It will use relative URLs (/api/*) which go through AppRouter
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_XSUAA_ENABLED=true
      - NODE_ENV=production
    networks:
      - slate-network
    depends_on:
      - backend

  # AppRouter - Changed port to 5001 (5000 is used by MLflow)
  approuter:
    build:
      context: ../approuter
      dockerfile: Dockerfile
    container_name: slate-approuter
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PLATFORM_COOKIE_NAME=SLATE_SESSION_ID
    volumes:
      - ../approuter/xs-app.json:/app/xs-app.json:ro
      - ../approuter/default-env.json:/app/default-env.json:ro
    networks:
      - slate-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO - S3-compatible local object storage for file uploads
  minio:
    image: minio/minio:latest
    container_name: slate-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - slate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  slate-network:
    driver: bridge

volumes:
  minio-data:
