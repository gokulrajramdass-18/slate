namespace: grtest-ns
global:
  domain: c-83567d2.kyma.ondemand.com
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: gokulraj18/slate-backend
    tag: kyma-v1.0.8
    pullPolicy: Always
  persistence:
    enabled: true
    size: 20Gi
    accessMode: ReadWriteOnce
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
sapAiCoreApi:
  enabled: true
  replicaCount: 1
  image:
    repository: gokulraj18/slate-sap-ai-core-api
    tag: v1.0.10
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  credentials:
    authUrl: https://sapit-core-playground-vole.authentication.eu10.hana.ondemand.com
    clientId: ***REMOVED-AICORE-CLIENT-ID***
    clientSecret: ***REMOVED-AICORE-CLIENT-SECRET***
    baseUrl: https://api.ai.prod.eu-central-1.aws.ml.hana.ondemand.com
    resourceGroup: ***REMOVED-AICORE-RESOURCE-GROUP***
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: gokulraj18/slate-frontend
    tag: kyma-v1.0.8
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
approuter:
  enabled: true
  replicaCount: 2
  image:
    repository: gokulraj18/slate-approuter
    tag: kyma-v1.0.8
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
xsuaa:
  enabled: true
  xsappname: slate-grtest
  tenantMode: dedicated
  serviceOfferingName: xsuaa
  servicePlanName: application
  scopes:
    - name: "$XSAPPNAME.User"
      description: "Slate user"
    - name: "$XSAPPNAME.Admin"
      description: "Slate administrator"
  roleTemplates:
    - name: User
      description: "Slate User"
      scopeReferences:
        - "$XSAPPNAME.User"
    - name: Admin
      description: "Slate Administrator"
      scopeReferences:
        - "$XSAPPNAME.User"
        - "$XSAPPNAME.Admin"
  roleCollections:
    - name: "Slate User"
      description: "Slate User Role Collection"
      roleTemplateReferences:
        - "User"
    - name: "Slate Admin"
      description: "Slate Admin Role Collection"
      roleTemplateReferences:
        - "Admin"
ingress:
  enabled: true
  host: slate-grtest.c-83567d2.kyma.ondemand.com
  gateway: kyma-gateway.kyma-system.svc.cluster.local
  tls:
    enabled: true
  rules:
  - path: /.*
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - HEAD
    - OPTIONS
    accessStrategies:
    - handler: noop
apiRule:
  enabled: true
  host: slate-grtest.c-83567d2.kyma.ondemand.com
  gateway: kyma-gateway.kyma-system.svc.cluster.local
  tls:
    enabled: true
  rules:
  - path: /.*
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - HEAD
    - OPTIONS
    accessStrategies:
    - handler: noop
xsApp:
  authenticationMethod: route
  welcomeFile: /index.html
  routes:
  - source: ^/api/(.*)$
    target: /api/$1
    destination: backend
    authenticationType: xsuaa
  - source: ^/(.*)$
    target: /$1
    destination: frontend
    authenticationType: xsuaa
destinations:
  backend:
    name: backend
    url: http://slate-backend:5055
    forwardAuthToken: true
  frontend:
    name: frontend
    url: http://slate-frontend:3000
    forwardAuthToken: false
objectstore:
  enabled: true
  instanceName: slate-objectstore
  bindingName: slate-objectstore-binding
  secretName: slate-objectstore-credentials
  plan: s3-standard
