[pytest]
# Pytest configuration for Open Notebook test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Required plugins
required_plugins = pytest-asyncio pytest-cov

# Asyncio configuration
asyncio_mode = auto

# Markers for organizing tests
markers =
    hana: Tests requiring HANA Cloud database connection (may be skipped)
    integration: Integration tests (slower, test multiple components)
    slow: Slow-running tests (>1 second)
    api: API endpoint tests using FastAPI TestClient

# Output options
# Show summary of all test outcomes
addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --tb=short

# Coverage configuration
[coverage:run]
source = open_notebook,api
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */migrations/*

[coverage:report]
# Fail if coverage below threshold
fail_under = 80

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Report settings
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
