version: '3.8'

services:
  a2a-inspector:
    image: a2a-inspector:latest
    container_name: a2a-inspector
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional: Set default agent URL
      - DEFAULT_AGENT_URL=http://host.docker.internal:5055/.well-known/agent-directory.json
    restart: unless-stopped
