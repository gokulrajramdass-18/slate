version: '3.8'

services:
  # AppRouter only - connects to backend/frontend running on host
  approuter:
    build:
      context: ../approuter
      dockerfile: Dockerfile
    container_name: slate-approuter
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PLATFORM_COOKIE_NAME=SLATE_SESSION_ID
      - DEBUG=*
    volumes:
      - ../approuter/xs-app.json:/app/xs-app.json:ro
      - ../approuter/default-env.json:/app/default-env.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/"]
      interval: 10s
      timeout: 5s
      retries: 3
