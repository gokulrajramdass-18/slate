{{- if .Values.ingress.enabled }}
apiVersion: gateway.kyma-project.io/v2alpha1
kind: APIRule
metadata:
  name: slate
  namespace: {{ .Values.namespace }}
  labels:
    app: slate
spec:
  hosts:
    - {{ .Values.ingress.host }}
  gateway: kyma-system/kyma-gateway
  service:
    name: slate-approuter
    port: {{ .Values.approuter.service.port }}
  rules:
    - path: /*
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - HEAD
        - OPTIONS
      noAuth: true
{{- end }}
