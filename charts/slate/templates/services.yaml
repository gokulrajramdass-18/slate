{{- if .Values.backend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: slate-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: slate-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: slate
    component: backend
{{- end }}

{{- if .Values.sapAiCoreApi.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: slate-sap-ai-core-api
  namespace: {{ .Values.namespace }}
  labels:
    app: slate-sap-ai-core-api
spec:
  type: {{ .Values.sapAiCoreApi.service.type }}
  ports:
  - port: {{ .Values.sapAiCoreApi.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: slate-sap-ai-core-api
{{- end }}

{{- if .Values.approuter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: slate-approuter
  namespace: {{ .Values.namespace }}
  labels:
    app: slate-approuter
spec:
  type: {{ .Values.approuter.service.type }}
  {{- if .Values.approuter.sessionAffinity.enabled }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  {{- end }}
  ports:
  - port: {{ .Values.approuter.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: slate
    component: approuter
{{- end }}
