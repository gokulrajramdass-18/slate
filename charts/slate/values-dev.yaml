# Development environment values
# Usage: helm install slate ./charts/slate -f charts/slate/values-dev.yaml

global:
  imageRegistry: "your-registry.io/your-project"

secrets:
  encryptionKey: "REPLACE_WITH_YOUR_DEV_ENCRYPTION_KEY"
  openaiApiKey: "sk-..."
  anthropicApiKey: "sk-ant-..."

backend:
  replicaCount: 1

  image:
    repository: slate-backend
    tag: "dev"
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  persistence:
    enabled: true
    size: 2Gi

  env:
    logLevel: "DEBUG"

frontend:
  replicaCount: 1

  image:
    repository: slate-frontend
    tag: "dev"
    pullPolicy: Always

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

approuter:
  enabled: true
  replicaCount: 1

xsuaa:
  enabled: true
  xsappname: slate-dev

apiRule:
  enabled: true
  host: slate-dev
