apiVersion: batch/v1
kind: Job
metadata:
  name: clear-slate-data
  namespace: grtest-ns
spec:
  template:
    spec:
      containers:
      - name: clear
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Clearing data directory..."
            rm -rf /data/*
            echo "Data cleared successfully"
        volumeMounts:
        - name: data
          mountPath: /data
      restartPolicy: Never
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: slate-backend-data
  backoffLimit: 1
