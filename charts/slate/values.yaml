namespace: grtest-ns
global:
  domain: c-83567d2.kyma.ondemand.com
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: gokulraj18/slate-backend
    tag: kyma-v1.0.0
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5055
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: ''
    size: 10Gi
    mountPath: /app/data
  env:
    xsuaaEnabled: 'true'
    apiHost: 0.0.0.0
    apiPort: '5055'
    databaseType: sqlite
    sqliteDbPath: /app/data/database.db
    logLevel: INFO
  database:
    type: sqlite
    path: /app/data/database.db
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: 5055
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: 5055
    initialDelaySeconds: 10
    periodSeconds: 5
sapAiCoreApi:
  enabled: true
  replicaCount: 1
  image:
    repository: gokulraj18/slate-sap-ai-core-api
    tag: v1.0.0
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5056
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  credentials:
    authUrl: ''
    clientId: ''
    clientSecret: ''
    baseUrl: ''
    resourceGroup: ''
approuter:
  enabled: true
  replicaCount: 2
  image:
    repository: gokulraj18/slate-approuter
    tag: kyma-v1.0.0
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5001
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  sessionAffinity:
    enabled: true
    cookieName: SLATE_SESSION_ID
  destinations:
    backend:
      name: backend
      url: http://slate-backend:5055
      forwardAuthToken: true
frontend:
  enabled: false
  image:
    repository: gokulraj18/slate-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    nodeEnv: production
    apiUrl: http://slate-backend:5055
    xsuaaEnabled: 'false'
xsuaa:
  enabled: true
  serviceOfferingName: xsuaa
  servicePlanName: application
  xsappname: slate-grtest
  scopes:
  - name: $XSAPPNAME.User
    description: User access
  - name: $XSAPPNAME.Admin
    description: Admin access
  role-templates:
  - name: User
    description: Standard user role
    scope-references:
    - $XSAPPNAME.User
  - name: Admin
    description: Administrator role
    scope-references:
    - $XSAPPNAME.User
    - $XSAPPNAME.Admin
ingress:
  enabled: true
  host: slate-grtest.c-83567d2.kyma.ondemand.com
  gateway: kyma-gateway.kyma-system.svc.cluster.local
  rules: &id001
  - path: /.*
    methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - HEAD
    - OPTIONS
    accessStrategies:
    - handler: noop
  tls:
    enabled: true
secrets:
  encryptionKey: change-me-in-production-use-32-chars
destinations:
  backend:
    name: backend
    url: http://slate-backend:5055
    forwardAuthToken: true
  frontend:
    name: frontend
    url: http://slate-frontend:3000
    forwardAuthToken: false
xsApp:
  authenticationMethod: route
  welcomeFile: /index.html
  logout:
    logoutEndpoint: /logout
    logoutPage: /
apiRule:
  enabled: true
  host: slate-grtest.c-83567d2.kyma.ondemand.com
  gateway: kyma-gateway.kyma-system.svc.cluster.local
  rules: *id001
  tls:
    enabled: true
