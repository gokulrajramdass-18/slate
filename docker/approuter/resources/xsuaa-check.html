<!DOCTYPE html>
<html>
<head>
    <title>Checking authentication...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: system-ui, -apple-system, sans-serif;">
        <div style="display: inline-block;">
            <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
            <p style="color: #666; font-size: 16px;">Authenticating with XSUAA...</p>
            <p style="color: #999; font-size: 14px; margin-top: 10px;">Please wait...</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Check XSUAA session and populate auth store
        (async function() {
            try {
                console.log('[XSUAA Check] Fetching user data from /api/auth/me...');
                const response = await fetch('/api/auth/me', {credentials: 'include'});

                console.log('[XSUAA Check] Response status:', response.status);

                if (response.ok) {
                    const userData = await response.json();
                    console.log('[XSUAA Check] User data received:', userData.username);

                    const authData = {
                        state: {
                            user: userData,
                            isAuthenticated: true,
                            token: 'xsuaa',
                            refreshToken: null,
                            permissions: []
                        },
                        version: 0
                    };
                    localStorage.setItem('auth-storage', JSON.stringify(authData));
                    console.log('[XSUAA Check] Auth data stored in localStorage');

                    // Redirect to dashboard
                    console.log('[XSUAA Check] Redirecting to /dashboard...');
                    window.location.href = '/dashboard';
                } else {
                    console.error('[XSUAA Check] Auth check failed with status:', response.status);
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('[XSUAA Check] Error during auth check:', error);
                window.location.href = '/';
            }
        })();
    </script>
</body>
</html>
