version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: slate-backend-approuter
    ports:
      - "5055:5055"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5055
      - DATABASE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/data/database.db
      - MOCK_XSUAA_ENABLED=true
      - XSUAA_ENABLED=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-dev-secret-key-change-me}
      - MOCK_XSUAA_SECRET=${MOCK_XSUAA_SECRET:-local-dev-secret-key-change-me}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    volumes:
      - ../../backend/data:/app/data
    networks:
      - slate-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: slate-frontend-approuter
    ports:
      - "3000:3000"
    environment:
      # Frontend should NOT use API URL when behind AppRouter
      # It will use relative URLs (/api/*) which go through AppRouter
      - NEXT_PUBLIC_API_URL=
      - NODE_ENV=development
    networks:
      - slate-network
    depends_on:
      - backend

  # AppRouter - Changed port to 5001 (5000 is used by MLflow)
  approuter:
    build:
      context: ../approuter
      dockerfile: Dockerfile
    container_name: slate-approuter
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PLATFORM_COOKIE_NAME=SLATE_SESSION_ID
    volumes:
      - ../approuter/xs-app.json:/app/xs-app.json:ro
      - ../approuter/default-env.json:/app/default-env.json:ro
    networks:
      - slate-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  slate-network:
    driver: bridge
